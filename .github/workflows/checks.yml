# Runs scripts/check.sh on every push and pull request.
# Blocks secrets, emails and phone numbers, and checks each skill's format.
name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the kit
        run: bash scripts/check.sh
